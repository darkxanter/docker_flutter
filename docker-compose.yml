# Requires Docker Compose 2.17+ for service build contexts.
# Build the complete stable chain: docker compose build
# For revision-aware builds and release tags, use make build instead.
services:
  flutter-stable:
    image: ${IMAGE_REPOSITORY:-xanter/flutter}:stable
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/flutter.dockerfile
      args:
        FLUTTER_CHANNEL: stable
        FLUTTER_REVISION: ${FLUTTER_REVISION:-}

  flutter-stable-web:
    image: ${IMAGE_REPOSITORY:-xanter/flutter}:stable-web
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/flutter_web.dockerfile
      args:
        BASE_IMAGE: flutter-base
      additional_contexts:
        flutter-base: service:flutter-stable

  flutter-stable-android:
    image: ${IMAGE_REPOSITORY:-xanter/flutter}:stable-android
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/flutter_android.dockerfile
      args:
        BASE_IMAGE: flutter-base
        ANDROID_SDK_TOOLS_VERSION: ${ANDROID_SDK_TOOLS_VERSION:-11076708}
        ANDROID_PLATFORM_VERSION: ${ANDROID_PLATFORM_VERSION:-36}
        ANDROID_BUILD_TOOLS_VERSION: ${ANDROID_BUILD_TOOLS_VERSION:-36.0.0}
      additional_contexts:
        flutter-base: service:flutter-stable

  flutter-stable-android-warmed:
    image: ${IMAGE_REPOSITORY:-xanter/flutter}:stable-android-warmed
    platform: linux/amd64
    build:
      context: .
      dockerfile: dockerfiles/flutter_android_warmed.dockerfile
      args:
        BASE_IMAGE: flutter-android
      additional_contexts:
        flutter-android: service:flutter-stable-android
