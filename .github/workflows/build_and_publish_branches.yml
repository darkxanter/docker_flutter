name: BUILD AND PUBLISH BRANCHES

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

concurrency:
  group: flutter-images
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: xanter/flutter
  FLUTTER_CHANNEL: stable
  CI_CACHE: 'true'

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Resolve current stable release
        run: bash tools/image.sh resolve-stable >> "$GITHUB_ENV"
      - name: Validate build configuration
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          docker compose config --quiet
      - name: Build and load all variants
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          load: true
      - name: Verify images
        timeout-minutes: 20
        run: make check
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_LOGIN_USERNAME }}
          password: ${{ secrets.DOCKER_LOGIN_PASSWORD }}
      - name: Publish checked images
        run: make push
